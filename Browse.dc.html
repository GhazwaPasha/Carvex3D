<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"></link>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"></link>
  <style>
    body { margin: 0; background: oklch(0.16 0.006 60); }
    a { color: oklch(0.78 0.012 240); text-decoration: none; }
    a:hover { color: oklch(0.85 0.012 240); }
    ::selection { background: oklch(0.35 0.01 240); }
  </style>
</helmet>

<div style="font-family: 'Sora', sans-serif; color: oklch(0.94 0.004 60); background: oklch(0.16 0.006 60); min-height: 100vh; background-image: linear-gradient(oklch(0.22 0.006 60 / 0.5) 1px, transparent 1px), linear-gradient(90deg, oklch(0.22 0.006 60 / 0.5) 1px, transparent 1px); background-size: 48px 48px;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid oklch(0.3 0.01 60); position: sticky; top: 0; background: oklch(0.16 0.006 60 / 0.95); z-index: 10; gap: 16px; flex-wrap: nowrap;">
    <div style="display: flex; align-items: center; gap: 20px; flex-shrink: 0;">
      <a href="Marketplace Home.dc.html" style="display: flex; align-items: center; gap: 8px; flex-shrink: 0;">
        <div style="width: 20px; height: 20px; background: oklch(0.78 0.012 240); clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); flex-shrink: 0;"></div>
        <div style="font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; color: oklch(0.94 0.004 60);">TOLERANCE</div>
      </a>
      <nav style="display: flex; gap: 16px; font-size: 13px; font-weight: 500; color: oklch(0.7 0.01 60); white-space: nowrap; flex-shrink: 0;">
        <a href="Browse.dc.html" style="color: oklch(0.94 0.004 60);">Browse</a>
        <a href="#" style="color: inherit;">Categories</a>
        <a href="Shop.dc.html" style="color: inherit;">Shops</a>
        <a href="#" style="color: inherit;">Machining Guide</a>
      </nav>
    </div>
    <div style="display: flex; align-items: center; gap: 14px; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 6px; background: oklch(0.2 0.006 60); border: 1px solid oklch(0.32 0.01 60); border-radius: 4px; padding: 7px 12px; width: 130px; flex-shrink: 0;">
        <div style="width: 12px; height: 12px; border: 1.5px solid oklch(0.6 0.01 60); border-radius: 50%; flex-shrink: 0;"></div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.6 0.01 60); white-space: nowrap;">search…</span>
      </div>
      <a href="https://wa.me/15551234567" style="background: oklch(0.78 0.012 240); color: oklch(0.16 0.006 60); padding: 9px 16px; border-radius: 4px; font-size: 13px; font-weight: 700; flex-shrink: 0; white-space: nowrap;">Message on WhatsApp</a>
    </div>
  </header>

  <div style="display: flex; max-width: 1400px; margin: 0 auto; padding: 32px 48px; gap: 40px;">

    <!-- Filters sidebar -->
    <aside style="width: 240px; flex-shrink: 0;">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: oklch(0.6 0.008 60); margin-bottom: 16px;">Filters</div>

      <div style="margin-bottom: 28px;">
        <div style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">Category</div>
        <sc-for list="{{ categories }}" as="cat" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 13px; color: oklch(0.75 0.008 60);">
            <div style="width: 14px; height: 14px; border: 1.5px solid oklch(0.4 0.01 60); border-radius: 3px; flex-shrink: 0;"></div>
            {{ cat }}
          </div>
        </sc-for>
      </div>

      <div style="margin-bottom: 28px;">
        <div style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">File format</div>
        <sc-for list="{{ formats }}" as="fmt" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 13px; color: oklch(0.75 0.008 60);">
            <div style="width: 14px; height: 14px; border: 1.5px solid oklch(0.4 0.01 60); border-radius: 3px; flex-shrink: 0;"></div>
            {{ fmt }}
          </div>
        </sc-for>
      </div>

      <div style="margin-bottom: 28px;">
        <div style="font-size: 13px; font-weight: 600; margin-bottom: 12px;">Material</div>
        <sc-for list="{{ materials }}" as="mat" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 9px; margin-bottom: 10px; font-size: 13px; color: oklch(0.75 0.008 60);">
            <div style="width: 14px; height: 14px; border: 1.5px solid oklch(0.4 0.01 60); border-radius: 3px; flex-shrink: 0;"></div>
            {{ mat }}
          </div>
        </sc-for>
      </div>

    </aside>

    <!-- Results -->
    <div style="flex: 1;">
      <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 24px;">
        <div>
          <h1 style="font-size: 24px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em;">All parts</h1>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: oklch(0.6 0.008 60);">{{ resultCount }} results</div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; background: oklch(0.2 0.006 60); border: 1px solid oklch(0.32 0.01 60); border-radius: 4px; padding: 8px 14px;">
          <span style="font-size: 13px; color: oklch(0.75 0.008 60);">Sort: Most popular</span>
          <div style="width: 8px; height: 8px; border-right: 1.5px solid oklch(0.6 0.01 60); border-bottom: 1.5px solid oklch(0.6 0.01 60); transform: rotate(45deg); margin-top: -3px;"></div>
        </div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px;">
        <sc-for list="{{ products }}" as="p" hint-placeholder-count="12">
          <a href="Product.dc.html" style="background: oklch(0.19 0.006 60); border: 1px solid oklch(0.3 0.01 60); border-radius: 6px; overflow: hidden; display: block;">
            <div style="aspect-ratio: 1; background: repeating-linear-gradient(135deg, oklch(0.23 0.006 60), oklch(0.23 0.006 60) 10px, oklch(0.2 0.006 60) 10px, oklch(0.2 0.006 60) 20px); display: flex; align-items: center; justify-content: center; position: relative;">
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: oklch(0.6 0.008 60); background: oklch(0.16 0.006 60); padding: 4px 10px; border-radius: 3px;">part render</span>
              <div style="position: absolute; top: 10px; left: 10px; background: oklch(0.16 0.006 60 / 0.9); font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 3px; color: oklch(0.78 0.012 240);">{{ p.format }}</div>
            </div>
            <div style="padding: 16px;">
              <div style="font-size: 15px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.01em;">{{ p.name }}</div>
              <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: oklch(0.6 0.008 60); margin-bottom: 6px;">{{ p.material }}</div>
              <div style="font-size: 13px; color: oklch(0.6 0.008 60); margin-bottom: 12px;">{{ p.creator }}</div>
              <div style="display: flex; align-items: center; gap: 4px; font-size: 13px; color: oklch(0.6 0.008 60);">
                <div style="width: 9px; height: 9px; background: oklch(0.78 0.012 240);"></div>
                {{ p.rating }}
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const products = [
      { name: "Modular Vise Jaw Set", creator: "Blackridge Machine Co.", material: "6061 Aluminum", price: "$28", rating: "4.9", format: "STEP" },
      { name: "Servo Mount Bracket", creator: "Vantage Tooling", material: "Steel, 3mm", price: "$16", rating: "4.8", format: "DXF" },
      { name: "Cable Chain Enclosure", creator: "Ironclad Works", material: "ABS / Delrin", price: "$22", rating: "4.7", format: "STEP" },
      { name: "Planetary Gear Set 3:1", creator: "Fenwick Precision", material: "Hardened Steel", price: "$34", rating: "4.9", format: "STEP" },
      { name: "T-Slot Fixture Plate", creator: "Blackridge Machine Co.", material: "6061 Aluminum", price: "$19", rating: "5.0", format: "DXF" },
      { name: "Router Sled Jig", creator: "Ironclad Works", material: "Plywood / Al rail", price: "$12", rating: "4.6", format: "DXF" },
      { name: "Spindle Housing", creator: "Vantage Tooling", material: "6061 Aluminum", price: "$41", rating: "4.8", format: "IGES" },
      { name: "Linear Rail Bracket Pair", creator: "Fenwick Precision", material: "Steel, 5mm", price: "$14", rating: "4.9", format: "STEP" },
      { name: "Quick-Change Tool Holder", creator: "Blackridge Machine Co.", material: "Tool Steel", price: "$25", rating: "4.9", format: "STEP" },
      { name: "Enclosure Panel, Vented", creator: "Ironclad Works", material: "6061 Aluminum", price: "$18", rating: "4.7", format: "DXF" },
      { name: "Timing Belt Pulley 20T", creator: "Fenwick Precision", material: "Delrin", price: "$9", rating: "4.8", format: "STEP" },
      { name: "Dovetail Clamp Set", creator: "Vantage Tooling", material: "6061 Aluminum", price: "$21", rating: "4.9", format: "IGES" }
    ];
    return {
      categories: ["Fixtures & Jigs", "Brackets & Mounts", "Enclosures", "Gears & Drives", "Tooling & Cutters", "Automotive Parts", "Robotics", "Custom Fixtures"],
      formats: ["STEP", "DXF", "IGES", "STL"],
      materials: ["Aluminum", "Steel", "Delrin / Acetal", "Plywood"],
      resultCount: products.length,
      products
    };
  }
}

</script>
</body>
</html>
