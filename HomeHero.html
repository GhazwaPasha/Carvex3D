<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
    "three/addons/controls/OrbitControls.js": "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js",
    "three/addons/exporters/OBJExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js",
    "three/addons/exporters/GLTFExporter.js": "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js"
  },
  "integrity": {
    "https://unpkg.com/three@0.184.0/build/three.module.js": "sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J",
    "https://unpkg.com/three@0.184.0/build/three.core.js": "sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT",
    "https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js": "sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js": "sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3",
    "https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js": "sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ"
  }
}
</script>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  three-d-stage:not(:defined) { visibility: hidden; }
</style>
</head>
<body>
<three-d-stage name="carved_column" background="transparent" style="width:100vw;height:100vh;display:block;"></three-d-stage>
<script src="./three-d-stage.js"></script>
<script type="module">
  import { STLLoader } from "https://unpkg.com/three@0.184.0/examples/jsm/loaders/STLLoader.js";

  const stage = document.querySelector('three-d-stage');
  const { THREE } = await stage.ready;
  const toolbar = stage.shadowRoot.querySelector('.toolbar');
  if (toolbar) toolbar.style.display = 'none';

  function smoothstep(a, b, x) {
    const t = Math.max(0, Math.min(1, (x - a) / (b - a)));
    return t * t * (3 - 2 * t);
  }

  const rawGeometry = await new STLLoader().loadAsync('./uploads/cleaned-carved-leg.stl');

  // free STL downloads often carry a small disconnected watermark blob fused
  // into the file — split into connected pieces and keep only the real object.
  function keepLargestSolid(geo) {
    const pos = geo.attributes.position;
    const triCount = pos.count / 3;
    const parent = new Int32Array(pos.count);
    for (let i = 0; i < pos.count; i++) parent[i] = i;
    function find(a) { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; }
    function union(a, b) { a = find(a); b = find(b); if (a !== b) parent[a] = b; }

    const keyToVert = new Map();
    const scale = 1e4;
    for (let i = 0; i < pos.count; i++) {
      const k = Math.round(pos.getX(i) * scale) + '_' + Math.round(pos.getY(i) * scale) + '_' + Math.round(pos.getZ(i) * scale);
      if (keyToVert.has(k)) union(i, keyToVert.get(k)); else keyToVert.set(k, i);
    }
    for (let t = 0; t < triCount; t++) {
      union(t * 3, t * 3 + 1);
      union(t * 3 + 1, t * 3 + 2);
    }
    const triRoot = new Int32Array(triCount);
    const sizeByRoot = new Map();
    for (let t = 0; t < triCount; t++) {
      const r = find(t * 3);
      triRoot[t] = r;
      sizeByRoot.set(r, (sizeByRoot.get(r) || 0) + 1);
    }
    if (sizeByRoot.size <= 1) return geo; // single solid, nothing to strip

    // compute a bounding-box diagonal per component to size-filter tiny blobs
    const bboxByRoot = new Map();
    for (let t = 0; t < triCount; t++) {
      const r = triRoot[t];
      let bb = bboxByRoot.get(r);
      if (!bb) { bb = { minX: Infinity, minY: Infinity, minZ: Infinity, maxX: -Infinity, maxY: -Infinity, maxZ: -Infinity }; bboxByRoot.set(r, bb); }
      for (let v = 0; v < 3; v++) {
        const idx = t * 3 + v;
        const x = pos.getX(idx), y = pos.getY(idx), z = pos.getZ(idx);
        if (x < bb.minX) bb.minX = x; if (x > bb.maxX) bb.maxX = x;
        if (y < bb.minY) bb.minY = y; if (y > bb.maxY) bb.maxY = y;
        if (z < bb.minZ) bb.minZ = z; if (z > bb.maxZ) bb.maxZ = z;
      }
    }
    let overallMaxDiag = 0;
    bboxByRoot.forEach((bb) => {
      const diag = Math.hypot(bb.maxX - bb.minX, bb.maxY - bb.minY, bb.maxZ - bb.minZ);
      if (diag > overallMaxDiag) overallMaxDiag = diag;
    });
    const keepRoots = new Set();
    bboxByRoot.forEach((bb, root) => {
      const diag = Math.hypot(bb.maxX - bb.minX, bb.maxY - bb.minY, bb.maxZ - bb.minZ);
      if (diag >= overallMaxDiag * 0.12) keepRoots.add(root); // drop tiny watermark-scale blobs only
    });

    const keptTris = [];
    for (let t = 0; t < triCount; t++) if (keepRoots.has(triRoot[t])) keptTris.push(t);
    if (keptTris.length === triCount) return geo; // nothing to strip

    const newPos = new Float32Array(keptTris.length * 9);
    for (let i = 0; i < keptTris.length; i++) {
      const t = keptTris[i];
      for (let v = 0; v < 3; v++) {
        const src = t * 3 + v;
        newPos[i * 9 + v * 3] = pos.getX(src);
        newPos[i * 9 + v * 3 + 1] = pos.getY(src);
        newPos[i * 9 + v * 3 + 2] = pos.getZ(src);
      }
    }
    const cleaned = new THREE.BufferGeometry();
    cleaned.setAttribute('position', new THREE.BufferAttribute(newPos, 3));
    cleaned.computeVertexNormals();
    return cleaned;
  }

  const geometry = keepLargestSolid(rawGeometry);
  geometry.computeBoundingBox();
  geometry.computeVertexNormals();
  const box = geometry.boundingBox;
  const center = new THREE.Vector3();
  box.getCenter(center);
  geometry.translate(-center.x, -center.y, -center.z);
  const size = new THREE.Vector3();
  box.getSize(size);
  const maxDim = Math.max(size.x, size.y, size.z) || 1;
  geometry.translate(0, -size.y * 0.05, 0);
  const scale = 0.2 / maxDim;

  const mat = new THREE.MeshStandardMaterial({
    name: "column_mat", color: 0xa9743f,
    metalness: 0.05, roughness: 0.55,
    transparent: true, opacity: 0
  });
  const wireMat = new THREE.LineBasicMaterial({
    color: 0x8fd8ff, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  const mesh = new THREE.Mesh(geometry, mat);
  mesh.name = "carved_column_solid";
  mesh.castShadow = true; mesh.receiveShadow = true;

  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geometry, 25), wireMat);
  edges.name = "carved_column_wire";

  const group = new THREE.Group();
  group.name = "carved_column";
  group.scale.setScalar(scale);
  group.rotation.x = 0; // STL is already authored with its long axis along Y
  group.rotation.z = Math.PI; // flip vertically
  group.add(mesh, edges);

  const outer = new THREE.Group();
  outer.add(group);
  stage.setObject(outer);

  function spreadAt(p) {
    return Math.sin(Math.max(0, Math.min(1, p)) * Math.PI);
  }

  function applyProgress(p) {
    outer.rotation.y = p * Math.PI * 5 + idleSpin;
    outer.rotation.x = 0.1;

    const s = spreadAt(p);
    const liftScale = 1 + s * 0.08;
    outer.scale.setScalar(liftScale);
    outer.position.y = s * 0.015;

    const solidness = smoothstep(0.32, 0.58, p);
    mat.opacity = solidness;
    wireMat.opacity = 1 - solidness;
  }

  let idleSpin = 0;
  let lastP = 0;
  applyProgress(0);
  function tick() {
    idleSpin += 0.0035;
    applyProgress(lastP);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  window.addEventListener('message', (e) => {
    const d = e.data || {};
    if (typeof d.progress !== 'number') return;
    lastP = Math.max(0, Math.min(1, d.progress));
  });
</script>
</body>
</html>
